name: kawangizi_mobile
description: "KawanGizi validator mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  provider: ^6.1.5+1
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  camera: ^0.11.0+2
  image_picker: ^1.2.4
  tflite_flutter: ^0.10.4
  image: ^4.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.17
  collection: ^1.19.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/kawangizi-logo.webp
    - assets/models/
